name: Lulu
fileGroups:
  - Configuration
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    exactVersion: 5.10.2
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 7.0.0
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.6
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: NO
targets:
  TravelApp:
    attributes:
      SystemCapabilities:
        com.apple.InAppPurchase:
          enabled: 1
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: Sources
      - path: Support/LaunchScreen.storyboard
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Resources/Legal
        buildPhase: resources
        excludes: ["*.md", "*.html", "*.json"]
      - path: Resources/Maps
        buildPhase: resources
      - path: Resources/PaymentCatalog.json
        buildPhase: resources
      - path: Resources/MediaCredits.json
        buildPhase: resources
      - path: Resources/BackendConfig.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TravelApp
        PRODUCT_BUNDLE_IDENTIFIER: com.lulu.tourtravel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Support/Info.plist
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.lulu.tourtravel
          DEVELOPMENT_TEAM: JPTS6M4T5B
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.lulu.tourtravel
          DEVELOPMENT_TEAM: JPTS6M4T5B
    dependencies:
      - package: Alamofire
        product: Alamofire
      - package: MapLibre
        product: MapLibre
      - package: Supabase
        product: Supabase
  LuluPurchaseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Purchases
      - path: Configuration/LuluCoins.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lulu.purchase-tests
        DEVELOPMENT_TEAM: JPTS6M4T5B
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TravelApp
  LuluAppleSandboxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AppleSandboxUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lulu.tourtravel.sandbox-tests
        DEVELOPMENT_TEAM: JPTS6M4T5B
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TravelApp
    dependencies:
      - target: TravelApp
schemes:
  Lulu:
    build:
      targets:
        TravelApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: LuluPurchaseTests
          skipped: false
        - name: LuluAppleSandboxUITests
          skipped: false
    archive:
      config: Release
