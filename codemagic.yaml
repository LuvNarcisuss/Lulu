workflows:
  lulu-ios-app-store:
    name: Lulu iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Lulu

    environment:
      xcode: "26.5"
      # Use the Apple Distribution certificate and matching App Store profile from Code signing identities.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lulu.tourtravel
      vars:
        XCODE_PROJECT: "LuluApp/Lulu.xcodeproj"
        XCODE_SCHEME: "Lulu"
        APP_STORE_APPLE_ID: "6832914128"

    scripts:
      - name: Set next App Store build number
        script: |
          set -euo pipefail

          LATEST_BUILD_NUMBER="$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" --all-versions)"
          LATEST_BUILD_NUMBER="${LATEST_BUILD_NUMBER:-0}"
          if [[ ! "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Expected a numeric App Store Connect build number." >&2
            exit 1
          fi

          NEXT_BUILD_NUMBER=$((10#$LATEST_BUILD_NUMBER + 1))
          echo "Using build number: $NEXT_BUILD_NUMBER"
          echo "LULU_BUILD_NUMBER=$NEXT_BUILD_NUMBER" >> "$CM_ENV"

      - name: Set up App Store signing
        script: |
          set -euo pipefail
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --archive-method app-store \
            --custom-export-options '{"manageAppVersionAndBuildNumber": false}'

      - name: Build signed Release IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$LULU_BUILD_NUMBER" \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        # Upload the IPA to App Store Connect without automatically submitting it for review.
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
